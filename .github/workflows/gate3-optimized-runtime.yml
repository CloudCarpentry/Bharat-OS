name: Gate 3 / Optimized Runtime

on:
  pull_request:
    branches: [developer]
  push:
    branches: [developer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      run_targets: ${{ steps.set-matrix.outputs.run_targets }}
      compile_targets: ${{ steps.set-matrix.outputs.compile_targets }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml jq
      - name: Generate matrix
        id: set-matrix
        run: |
          RUN_TARGETS=$(python3 -c 'import yaml, json; targets = yaml.safe_load(open("quality/ci/release-targets.yaml"))["targets"]; print(json.dumps([t for t in targets if "arm32" not in t and "riscv32" not in t]))')
          COMPILE_TARGETS=$(python3 -c 'import yaml, json; targets = yaml.safe_load(open("quality/ci/release-targets.yaml"))["targets"]; print(json.dumps([t for t in targets if "arm32" in t or "riscv32" in t]))')
          echo "run_targets=$RUN_TARGETS" >> $GITHUB_OUTPUT
          echo "compile_targets=$COMPILE_TARGETS" >> $GITHUB_OUTPUT

  release-qemu:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        target_yaml: ${{ fromJson(needs.prepare-matrix.outputs.run_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld qemu-system-x86 qemu-system-arm qemu-system-misc python3
      - name: Build and Run Tests
        run: |
          python3 tools/build.py all --target-yaml ${{ matrix.target_yaml }} --mode release --smoke
        timeout-minutes: 15
      - name: Upload QEMU Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-release-qemu-logs-${{ strategy.job-index }}
          path: |
            build/
            !build/**/*.o
            !build/**/*.map
            !build/**/*.a
            !build/**/*.d
            build/**/*.log
            build/**/*.json
            build/**/Testing/

  compile-only:
    runs-on: ubuntu-latest
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        target_yaml: ${{ fromJson(needs.prepare-matrix.outputs.compile_targets) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld python3
      - name: Build
        run: |
          python3 tools/build.py kernel --target-yaml ${{ matrix.target_yaml }}

  gate3-summary:
    name: Gate 3 / Optimized Runtime Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [release-qemu, compile-only]
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.release-qemu.result }}" != "success" ] || \
             [ "${{ needs.compile-only.result }}" != "success" ]; then
            /bin/false
          fi
