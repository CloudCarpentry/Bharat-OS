name: arm64_mobile_gui_android
kind: qemu_target

arch: arm64
board: qemu-virt-arm64
device_profile: mobile
personality_profile: android
execution_profile: mix

build:
  cmake_preset: arm64-mobile-android-release
  cmake_defs:
    BHARAT_ARCH_FAMILY: ARM64
    BHARAT_DEVICE_PROFILE: MOBILE
    BHARAT_PERSONALITY_PROFILE: ANDROID
    BHARAT_TARGET_BOARD: virt
    BHARAT_BOOT_GUI: ON
    BHARAT_ENABLE_FBUI: ON
    BHARAT_SHOWCASE_GUI: ON
    BHARAT_UI_LVGL: ON
    BHARAT_ENABLE_ADVANCED_VM: ON

kernel:
  canonical_artifacts:
    elf: kernel/kernel.elf
    map: kernel/kernel.map

boot:
  protocol: linux_arm64
  artifact_format: raw_bin
  dtb:
    mode: qemu_generated
    required: true
    handoff_register: x0

package:
  transforms:
    - type: elf_to_bin
      input: kernel/kernel.elf
      output: kernel/kernel.bin

run:
  backend: qemu
  machine: virt
  cpu: cortex-a72
  memory: 1024M
  nographic: false
  serial:
    - stdio
  boot_artifact: kernel/kernel.bin
  extra_args:
    - "-device"
    - "virtio-gpu-pci"
    - "-device"
    - "virtio-keyboard-pci"
    - "-device"
    - "virtio-tablet-pci"
    - "-netdev"
    - "user,id=net0"
    - "-device"
    - "virtio-net-pci,netdev=net0"
    - "-device"
    - "qemu-xhci"
    - "-d"
    - "guest_errors,unimp"

debug:
  backend: gdb_remote
  stop_on_entry: false
  gdb_port: 1234
