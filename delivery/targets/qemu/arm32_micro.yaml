name: arm32_micro
kind: qemu_target
arch: arm32
board: qemu-virt-arm32
device_profile: micro
personality_profile: native
execution_profile: mix
footprint_profile: micro_arm32
build:
  cmake_preset: arm32-qemu-mmu-lite-headless
  cmake_defs:
    BHARAT_ARCH_FAMILY: ARM32
    BHARAT_DEVICE_PROFILE: MICRO
    BHARAT_PERSONALITY_PROFILE: NATIVE
    BHARAT_TARGET_BOARD: virt
    BHARAT_BOOT_GUI: false
    BHARAT_PROFILE_MMU_FULL: false
    BHARAT_PROFILE_MMU_LITE: false
    BHARAT_PROFILE_MPU_ONLY: true
    BHARAT_ENABLE_SERVICE_BOOT_DISPLAYD: false
    BHARAT_BUILD_SVC_BOOT_DISPLAYD: false
kernel:
  canonical_artifacts:
    elf: kernel/kernel.elf
boot:
  protocol: linux_arm64
  artifact_format: raw_bin
  dtb:
    mode: qemu_generated
    required: true
package:
  transforms:
  - type: elf_to_bin
    input: kernel/kernel.elf
    output: kernel/kernel.bin
run:
  backend: qemu
  machine: virt
  cpu: cortex-a15
  memory: 256M
  nographic: true
  serial:
  - stdio
  boot_artifact: kernel/kernel.bin
services:
  namesvc:
    state: disabled
  process_manager:
    state: disabled
  boot_displayd:
    state: disabled
  app_payload:
    state: required
