name: riscv64_mobile_headless_android
kind: qemu_target

arch: riscv64
board: virt
device_profile: mobile
personality_profile: android
execution_profile: mix

implementation_maturity:
  profile: DEVELOPMENT
  allow: [STUB]

build:
  cmake_preset: riscv64-mobile-android-release
  cmake_defs:
    BHARAT_INIT_CORE_BOOTSTRAP_ONLY: ON
    BHARAT_ARCH_FAMILY: RISCV64
    BHARAT_DEVICE_PROFILE: MOBILE
    BHARAT_PERSONALITY_PROFILE: ANDROID
    BHARAT_TARGET_BOARD: virt
    BHARAT_BOOT_GUI: OFF

kernel:
  canonical_artifacts:
    elf: kernel/kernel.elf

boot:
  protocol: opensbi_payload
  artifact_format: elf
  dtb:
    mode: qemu_generated

package:
  transforms: []

run:
  backend: qemu
  machine: virt
  memory: 512M
  nographic: true
  serial:
    - stdio
  boot_artifact: kernel/kernel.elf
  extra_args:
    - "-netdev"
    - "user,id=net0"
    - "-device"
    - "virtio-net-device,netdev=net0"
    - "-device"
    - "qemu-xhci"

debug:
  backend: gdb_remote
  stop_on_entry: false
  gdb_port: 1234
