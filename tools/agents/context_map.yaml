# Bharat-OS Subsystem Context Map
# Authoritative machine-readable mapping for agents to query compact context packs.

vm-manager:
  name: "Virtual Memory Manager Service"
  layer: service
  policy: true
  sources:
    - core/services/vm_manager/
  contracts:
    - interface/include/bharat/uapi/
  architecture:
    - docs/architecture/CONTRACTS.md
  skills:
    - bharat-os-service-runtime
    - bharat-os-memory-model
    - bharat-os-capability-security
  tests:
    - test_vm_manager
    - test_vm_authority_integration
  runtime_markers:
    - VM_MANAGER_BOUND
    - VM_MANAGER_AUTHORITY_READY
    - VM_MANAGER_READY
  protection_models:
    - MMU_FULL
    - MMU_LITE
    - MPU

