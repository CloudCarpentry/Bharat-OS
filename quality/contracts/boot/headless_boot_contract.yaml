version: 1
description: "Bharat-OS Headless Boot Contract baseline"

common:
  forbidden: &common_forbidden
    - "PANIC"
    - "ASSERT"
    - "FAULT"
    - "triple fault"
    - "Unhandled exception"
    - "kernel oops"
    - "segmentation fault"
    - "TIMEOUT"
    - "QEMU TIMEOUT"
    - "BOOT TIMEOUT"

targets:
  x86_64_desktop_headless:
    description: "x86_64 MMU-Full headless boot"
    required:
      - "BOOT_HANDOFF: NORMALIZED"
      - "BOOT_HANDOFF: VALIDATED"
      - "BOOT_MEMORY: MODULES_RESERVED"
      - "INIT_MODULE: services/init FOUND"
      - "INIT_ELF: VALIDATED"
      - "INIT_ASPACE: READY"
      - "INIT_THREAD: SCHEDULED"
      - "USER_INIT: ENTERED"
      - "USER_INIT: STARTUP_ABI_OK"
      - "USER_INIT: SERVICE_GRAPH_COMPLETE"
      - "BOOT_RUNTIME: STABLE"
    forbidden: *common_forbidden
    timeout_seconds: 45

  x86_64_rtos_mmu_lite_headless:
    description: "x86_64 RT MMU-Lite headless boot"
    required:
      - "BOOT_HANDOFF: NORMALIZED"
      - "BOOT_HANDOFF: VALIDATED"
      - "BOOT_MEMORY: MODULES_RESERVED"
      - "INIT_MODULE: services/init FOUND"
      - "INIT_ELF: VALIDATED"
      - "INIT_ASPACE: READY"
      - "INIT_THREAD: SCHEDULED"
      - "USER_INIT: ENTERED"
      - "USER_INIT: STARTUP_ABI_OK"
